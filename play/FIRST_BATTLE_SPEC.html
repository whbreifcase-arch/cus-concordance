<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CUS — First Battle · Screen Map</title>
<link rel="stylesheet" href="cus.css">
<style>
  /* spec-page extras */
  .toc{border:1px solid var(--faint); border-radius:11px; padding:12px 16px; margin:16px 0; background:var(--paper2)}
  .toc h4{margin-top:0}
  .toc a{display:block; font-size:12.5px; text-decoration:none; padding:2px 0; border-bottom:1px solid transparent}
  .toc a:hover{border-bottom-color:var(--gold)}
  .toc a.lv2{padding-left:14px; font-size:12px; color:var(--mid)}
  #doc h2{scroll-margin-top:14px}
  #doc h3{scroll-margin-top:14px; color:var(--goldtxt)}
  #doc table{font-size:12px}
  #doc blockquote{background:var(--wash); border-radius:0 8px 8px 0; padding:10px 14px}
  .loading{text-align:center; color:var(--lt); font-size:12px; letter-spacing:.16em; text-transform:uppercase; font-weight:700; padding:40px 0}
</style>
</head>
<body>

<div class="brandbar">
  <span class="brand-sigil">◆</span>
  <span class="brand-word">CUS</span>
  <span class="sep">·</span>
  <span>First Battle — Screen Map</span>
  <span class="brand-meta">spec v1.0</span>
  <div class="theme-toggle" role="group" aria-label="Color theme">
    <button type="button" data-set-theme="light" aria-pressed="false">Light</button>
    <button type="button" data-set-theme="dark" aria-pressed="true">Dark</button>
  </div>
</div>

<div class="wrap">
  <a class="backlink gold" href="index.html">‹ Play CUS</a>
  <div class="sheet">
    <div id="toc"></div>
    <div id="doc"><div class="loading">Loading the screen map…</div></div>
    <div class="foot">
      Screen map v1.0 · rules source: kernel rebuild v0.6 (signed)<br>
      Rendered from PLAY_FIRST_BATTLE_SCREENMAP.md — the single source, never a copy
    </div>
  </div>
</div>

<script src="cus.js"></script>
<script>
(function () {
  'use strict';

  /* ====================================================================
     A deliberately small Markdown renderer. It handles exactly the
     constructs the screen map uses — headings, tables, fenced code,
     blockquotes (including nested headings and tables), lists, rules,
     and inline bold/italic/code/links. Nothing more, so there is no
     dependency and nothing to load from a CDN.
     ==================================================================== */

  function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function inline(s) {
    return esc(s)
      .replace(/`([^`]+)`/g, function (_, c) { return '<code>' + c + '</code>'; })
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, function (_, t, u) {
        return '<a href="' + u + '">' + t + '</a>';
      });
  }

  function slug(s) {
    return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  }

  var headings = [];
  var usedIds = Object.create(null);

  function uniqueId(base) {
    if (!usedIds[base]) { usedIds[base] = 1; return base; }
    return base + '-' + (++usedIds[base]);
  }

  /* `top` is false inside a blockquote, so quoted headings never reach the
     table of contents and never mint a competing anchor id. */
  function render(md, top) {
    var lines = md.replace(/\r\n/g, '\n').split('\n');
    var out = [], i = 0;

    function table(startsAt) {
      // a table is: header row | separator row of ---/:--- | body rows
      if (!/^\s*\|/.test(lines[startsAt]) ) return null;
      if (!/^\s*\|[\s:|-]+\|\s*$/.test(lines[startsAt + 1] || '')) return null;
      var cells = function (row) {
        return row.trim().replace(/^\||\|$/g, '').split('|').map(function (c) { return c.trim(); });
      };
      var head = cells(lines[startsAt]);
      var aligns = cells(lines[startsAt + 1]).map(function (a) {
        if (/^:.*:$/.test(a)) return ' style="text-align:center"';
        if (/:$/.test(a))     return ' style="text-align:right"';
        return '';
      });
      var body = [], j = startsAt + 2;
      while (j < lines.length && /^\s*\|/.test(lines[j])) { body.push(cells(lines[j])); j++; }
      var html = '<div class="tablewrap"><table><thead><tr>' +
        head.map(function (h, k) { return '<th' + (aligns[k] || '') + '>' + inline(h) + '</th>'; }).join('') +
        '</tr></thead><tbody>' +
        body.map(function (row) {
          return '<tr>' + row.map(function (c, k) {
            return '<td' + (aligns[k] || '') + '>' + inline(c) + '</td>';
          }).join('') + '</tr>';
        }).join('') +
        '</tbody></table></div>';
      return { html: html, next: j };
    }

    while (i < lines.length) {
      var line = lines[i];

      // fenced code
      if (/^```/.test(line)) {
        var buf = [], j = i + 1;
        while (j < lines.length && !/^```/.test(lines[j])) { buf.push(lines[j]); j++; }
        out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>');
        i = j + 1; continue;
      }

      // horizontal rule
      if (/^\s*---+\s*$/.test(line)) { out.push('<hr>'); i++; continue; }

      // heading
      var h = /^(#{1,6})\s+(.*)$/.exec(line);
      if (h) {
        var lv = h[1].length, txt = h[2].trim();
        if (top) {
          var id = uniqueId(slug(txt));
          if (lv <= 3) headings.push({ lv: lv, txt: txt, id: id });
          out.push('<h' + lv + ' id="' + id + '">' + inline(txt) + '</h' + lv + '>');
        } else {
          out.push('<h' + lv + '>' + inline(txt) + '</h' + lv + '>');
        }
        i++; continue;
      }

      // table
      var t = table(i);
      if (t) { out.push(t.html); i = t.next; continue; }

      // blockquote — collect, strip the marker, render recursively
      if (/^>\s?/.test(line)) {
        var qbuf = [], k = i;
        while (k < lines.length && (/^>\s?/.test(lines[k]) || (lines[k].trim() === '' && /^>\s?/.test(lines[k + 1] || '')))) {
          qbuf.push(lines[k].replace(/^>\s?/, ''));
          k++;
        }
        out.push('<blockquote>' + render(qbuf.join('\n'), false) + '</blockquote>');
        i = k; continue;
      }

      // lists
      if (/^\s*[-*]\s+/.test(line) || /^\s*\d+\.\s+/.test(line)) {
        var ordered = /^\s*\d+\.\s+/.test(line);
        var items = [], m = i;
        while (m < lines.length && (/^\s*[-*]\s+/.test(lines[m]) || /^\s*\d+\.\s+/.test(lines[m]) ||
               (/^\s{2,}\S/.test(lines[m]) && items.length))) {
          if (/^\s*[-*]\s+/.test(lines[m]) || /^\s*\d+\.\s+/.test(lines[m])) {
            items.push(lines[m].replace(/^\s*(?:[-*]|\d+\.)\s+/, ''));
          } else {
            items[items.length - 1] += ' ' + lines[m].trim();   // continuation line
          }
          m++;
        }
        var tag = ordered ? 'ol' : 'ul';
        out.push('<' + tag + '>' + items.map(function (x) {
          return '<li>' + inline(x) + '</li>';
        }).join('') + '</' + tag + '>');
        i = m; continue;
      }

      // blank
      if (!line.trim()) { i++; continue; }

      // paragraph — gather until a blank line or a block starter
      var pbuf = [], n = i;
      while (n < lines.length && lines[n].trim() &&
             !/^(#{1,6}\s|>|```|\s*[-*]\s|\s*\d+\.\s|\s*\|)/.test(lines[n]) &&
             !/^\s*---+\s*$/.test(lines[n])) {
        pbuf.push(lines[n]); n++;
      }
      if (pbuf.length) { out.push('<p>' + inline(pbuf.join(' ')) + '</p>'); i = n; }
      else { i++; }
    }
    return out.join('\n');
  }

  function buildToc() {
    if (!headings.length) return;
    var links = headings.filter(function (h) { return h.lv === 1 || h.lv === 2; }).map(function (h) {
      return '<a class="' + (h.lv === 2 ? 'lv2' : '') + '" href="#' + h.id + '">' + esc(h.txt) + '</a>';
    }).join('');
    document.getElementById('toc').innerHTML =
      '<div class="toc"><h4>On this page</h4>' + links + '</div>';
  }

  var SRC = '../PLAY_FIRST_BATTLE_SCREENMAP.md';
  var BLOB = 'https://github.com/whbreifcase-arch/cus-kernel-rebuild/blob/main/PLAY_FIRST_BATTLE_SCREENMAP.md';

  function fail(why) {
    document.getElementById('doc').innerHTML =
      '<div class="notice"><strong>The screen map could not be loaded here.</strong><br>' +
      esc(why) + '<br><br>' +
      'This page reads <code>PLAY_FIRST_BATTLE_SCREENMAP.md</code> live rather than keeping a ' +
      'second copy of it — so the spec and this page can never drift apart. Opening the file ' +
      'straight off the disk (<code>file://</code>) blocks that read; serve the folder over ' +
      'http, or read it on GitHub:<br><br>' +
      '<a href="' + BLOB + '">Open the screen map on GitHub ›</a></div>';
  }

  function show(html) {
    document.getElementById('doc').innerHTML = html;
    buildToc();
    if (location.hash) {
      var el = document.getElementById(location.hash.slice(1));
      if (el) el.scrollIntoView();
    }
  }

  /* GitHub Pages runs Jekyll by default, which converts root .md files to
     .html and can 404 the raw source. Try the markdown first; if it is not
     there, fall back to Jekyll's converted output; only then give up. */
  var JEKYLL = SRC.replace(/\.md$/, '.html');

  fetch(SRC)
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(function (md) { show(render(md, true)); })
    .catch(function () {
      return fetch(JEKYLL)
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.text();
        })
        .then(function (doc) {
          // Jekyll emits a bare fragment when the file has no layout; if a
          // full document comes back, lift just its body.
          var body = /<body[^>]*>([\s\S]*)<\/body>/i.exec(doc);
          show(body ? body[1] : doc);
        });
    })
    ['catch'](function (e) {
      fail('Tried ' + SRC + ' and ' + JEKYLL + ' — ' + (e.message || String(e)) + '.');
    });
})();
</script>
</body>
</html>
