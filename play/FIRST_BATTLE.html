<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CUS — First Battle</title>
<link rel="stylesheet" href="cus.css">
<style>
  /* ------------------------------------------------------------------
     First Battle owns the whole viewport. No page scroll, ever
     (screen map §0.3). The visual area flexes; the text block does not. */
  html,body{height:100%; overflow:hidden}
  body{padding:0; display:flex; flex-direction:column}

  .fb{
    position:fixed; inset:0; display:flex; flex-direction:column;
    max-width:560px; margin:0 auto; background:var(--paper);
    border-left:1px solid var(--faint); border-right:1px solid var(--faint);
  }
  html[data-theme="dark"] .fb{background:linear-gradient(180deg,#151f27 0%,#10171d 100%)}

  /* top strip */
  .fb-top{
    flex:0 0 auto; display:flex; align-items:center; gap:10px;
    padding:calc(env(safe-area-inset-top) + 9px) 14px 9px;
    border-bottom:1px solid var(--faint);
  }
  .fb-top button{
    font:inherit; background:none; border:0; color:var(--lt); cursor:pointer;
    font-size:11px; letter-spacing:.1em; font-weight:700; padding:6px 4px;
  }
  .fb-top button:disabled{opacity:.25; cursor:default}
  .fb-title{
    flex:1; text-align:center; font-size:9px; letter-spacing:.2em; font-weight:700;
    color:var(--mid); text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .fb-ap{display:flex; gap:5px; align-items:center}
  .fb-ap i{
    width:11px; height:11px; border-radius:50%; border:1.5px solid var(--gold);
    background:var(--gold); display:block;
  }
  .fb-ap i.spent{background:none; opacity:.35}
  .fb-prog{font-size:9px; letter-spacing:.12em; font-weight:700; color:var(--lt)}

  /* visual area */
  .fb-vis{
    flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center;
    padding:12px 16px; position:relative;
  }
  .fb-vis svg.dx{max-width:100%; max-height:100%; height:auto; display:block}
  .fb-vis .stack{display:flex; flex-direction:column; align-items:center; gap:12px; max-height:100%; width:100%}
  .fb-vis .stack svg.dx{max-height:none}

  /* instruction block */
  .fb-say{
    flex:0 0 auto; padding:14px 20px 4px; border-top:1px solid var(--faint);
  }
  .fb-trig{font-size:12px; color:var(--goldtxt); font-weight:700; letter-spacing:.03em; margin-bottom:4px}
  .fb-name{font-family:Georgia,serif; font-size:23px; font-weight:700; letter-spacing:.03em; line-height:1.15}
  .fb-instr{font-size:14.5px; margin-top:7px; line-height:1.5}
  .fb-cons{font-size:13.5px; color:var(--mid); margin-top:4px; line-height:1.5}
  .fb-say b{color:var(--ink)}

  /* bottom controls */
  .fb-ctl{flex:0 0 auto; padding:12px 16px calc(env(safe-area-inset-bottom) + 14px)}
  .btn{
    display:block; width:100%; font:inherit; font-size:13px; letter-spacing:.16em; font-weight:700;
    text-transform:uppercase; padding:16px 14px; border-radius:12px; border:2px solid var(--ink);
    background:var(--ink); color:var(--paper); cursor:pointer; text-align:center;
  }
  html[data-theme="dark"] .btn{background:var(--gold); border-color:var(--gold); color:#0a1014}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:none; color:var(--ink); border-color:var(--faint)}
  html[data-theme="dark"] .btn.ghost{background:none; color:var(--ink); border-color:var(--faint)}
  .btn + .btn{margin-top:8px}
  .btn-min{
    display:block; width:100%; background:none; border:0; font:inherit; font-size:10px;
    letter-spacing:.14em; font-weight:700; text-transform:uppercase; color:var(--lt);
    padding:10px; cursor:pointer; text-decoration:none; text-align:center;
  }

  /* the verb hub */
  .verbs{display:grid; grid-template-columns:1fr 1fr 1fr; gap:9px}
  .verb{
    font:inherit; background:var(--paper2); border:2px solid var(--ink); border-radius:13px;
    padding:12px 6px 11px; cursor:pointer; color:inherit; text-align:center;
  }
  html[data-theme="dark"] .verb{background:rgba(255,255,255,.03)}
  .verb svg.dx{width:100%; height:auto; max-width:78px; margin:0 auto 5px}
  .verb .vw{font-family:Georgia,serif; font-size:15px; font-weight:700; letter-spacing:.04em}
  .verb .vd{font-size:9.5px; color:var(--mid); margin-top:3px; line-height:1.35}
  .verb[disabled]{opacity:.34; cursor:not-allowed; border-style:dashed}
  .verb[disabled] .vw{text-decoration:line-through}
  .gate{
    text-align:center; font-size:9.5px; letter-spacing:.16em; font-weight:700;
    color:var(--redtxt); margin-top:10px; text-transform:uppercase;
  }
  .gate.pulse{animation:gp .5s ease 2}
  @keyframes gp{50%{transform:scale(1.07)}}

  /* move slider */
  .ruler{margin-top:2px}
  .ruler input[type=range]{width:100%; accent-color:var(--gold); height:30px}
  .ruler-ticks{display:flex; justify-content:space-between; font-size:9px; letter-spacing:.1em;
    font-weight:700; color:var(--lt); text-transform:uppercase; margin-top:-4px}
  .ruler-ticks b{color:var(--goldtxt)}

  /* packet card (styling for CUS_DX.packetCard) */
  .dxcard{border:1.5px solid var(--ink); border-radius:11px; overflow:hidden; background:var(--paper2); width:100%; max-width:330px}
  html[data-theme="dark"] .dxcard{background:rgba(255,255,255,.035)}
  .dxcard-name{font-family:Georgia,serif; font-size:15px; font-weight:700; letter-spacing:.05em; padding:9px 13px 2px}
  .dxcard-stats{font-size:10px; letter-spacing:.13em; font-weight:700; color:var(--goldtxt); padding:0 13px 9px}
  .dxcard-grades{width:100%; border-collapse:collapse; font-size:12px}
  .dxcard-grades th{
    text-align:left; padding:6px 13px; font-size:9px; letter-spacing:.14em; color:var(--mid);
    border-top:1px solid var(--faint); width:78px; background:none;
  }
  .dxcard-grades td{padding:6px 13px; border-top:1px solid var(--faint)}
  .dxg.off{opacity:.3}
  .dxg.off th,.dxg.off td{text-decoration:line-through}
  .dxg.on th{color:var(--goldtxt)}
  .dxg.on td{color:var(--goldtxt); font-weight:700}
  .dxg.on th,.dxg.on td{background:rgba(154,115,23,.11)}

  .tapnote{font-size:11px; color:var(--lt); text-align:center; margin-top:8px; letter-spacing:.04em}
  .targets{position:absolute; inset:12px 16px; pointer-events:none}
  .hit{position:absolute; pointer-events:auto; background:none; border:0; cursor:pointer;
       border-radius:50%; transform:translate(-50%,-50%)}

  @media (max-height:620px){
    .fb-name{font-size:19px} .fb-instr{font-size:13px} .fb-say{padding-top:10px}
    .btn{padding:13px} .verb svg.dx{max-width:60px}
  }
</style>
</head>
<body>

<div class="fb">
  <div class="fb-top">
    <button id="back" type="button" aria-label="Back">&lsaquo;&nbsp;BACK</button>
    <div class="fb-title" id="title">FIRST BATTLE</div>
    <div class="fb-ap" id="ap"></div>
    <button id="exit" type="button" aria-label="Exit tutorial">&times;</button>
  </div>
  <div class="fb-vis" id="vis"></div>
  <div class="fb-say" id="say"></div>
  <div class="fb-ctl" id="ctl"></div>
</div>

<script src="rules.js"></script>
<script src="diagrams.js"></script>
<script src="cus.js"></script>
<script>
(function () {
  'use strict';
  var R = window.CUS_RULES, DX = window.CUS_DX;
  var rule = function (id) { return R.byId[id]; };
  var PACKET = {}; R.packets.forEach(function (p) { PACKET[p.packet_id] = p; });
  var FIG = {};    R.figures.forEach(function (f) { FIG[f.definition_id] = f; });

  /* ==================================================== THE BOARD STATE */
  var S;
  function reset() {
    S = {
      ap: 2, apMax: 2, attackUsed: false, over: false,
      moves: 0, engaged: null, at: [6.0, 2.0], facing: 'N',
      swordsmanWounds: 0,
      gob: {
        A: { at: [6.0, 6.0], wounds: 0, morale: 0, dead: false },
        B: { at: [7.6, 6.0], wounds: 0, morale: 0, dead: false },
        C: { at: [4.4, 6.0], wounds: 0, morale: 0, dead: false }
      },
      lastRoll: null, lastGrade: 0, woundsLanded: 0, saved: 0,
      counterRoll: null, counterGrade: 0, counterWounds: 0,
      nerveWho: null, nerveRoll: null, nerveSucc: 0,
      seen: {}, armed: false, pending: null
    };
  }
  reset();

  var ME = FIG.MIL_SWORD, GOB = FIG.GOB_WARRIOR;
  var MYPACKET = PACKET.militia_sword, GOBPACKET = PACKET.goblin_shiv;

  function dist(a, b) { return Math.sqrt(Math.pow(a[0]-b[0],2) + Math.pow(a[1]-b[1],2)); }
  function contactGap() {
    /* centre-to-centre distance at which a Medium square touches a Small square */
    return (DX.footprint('Square','Medium') + DX.footprint('Square','Small')) / 2;
  }
  function livingGoblins() {
    return ['A','B','C'].filter(function (k) { return !S.gob[k].dead; });
  }
  function touching() {
    var g = contactGap() + 0.05;
    return livingGoblins().filter(function (k) { return dist(S.at, S.gob[k].at) <= g; });
  }
  function d6() { return 1 + Math.floor(Math.random() * 6); }
  function roll(n) { var o = []; for (var i = 0; i < n; i++) o.push(d6()); return o; }
  function succ(vals, target) { return vals.filter(function (v) { return v >= target; }).length; }

  /* ============================================== BOARD RENDER (shared) */
  function boardOpts(o) {
    o = o || {};
    var figs = [];
    var focus = o.focus || [];
    livingGoblins().forEach(function (k) {
      var g = S.gob[k];
      figs.push({
        at: g.at, shape: 'Square', size: 'Small', facing: 'S',
        tone: focus.indexOf(k) >= 0 ? 'receiving' : (o.dimEnemy ? 'bystander' : 'bystander'),
        halo: (o.halo || []).indexOf(k) >= 0
      });
    });
    ['A','B','C'].forEach(function (k) {
      if (S.gob[k].dead && !o.hideDead) {
        figs.push({ at: S.gob[k].at, shape: 'Square', size: 'Small', tone: 'was', dead: true });
      }
    });
    if (o.ghostFrom) {
      figs.push({ at: o.ghostFrom, shape: 'Square', size: 'Medium', tone: 'was' });
    }
    figs.push({
      at: o.meAt || S.at, shape: 'Square', size: 'Medium', facing: S.facing,
      tone: o.meTone || 'acting', halo: o.meHalo
    });
    return {
      wall: { y: 9.0, from: 2.0, to: 10.0, gapAt: 4.0, gapWidth: 1.4 },
      objective: { at: [6.0, 10.0] },
      dimObjective: !o.showObjective,
      figures: figs,
      paths: o.paths || [], strikes: o.strikes || [],
      rings: o.rings || [], arrows: o.arrows || [], refaces: o.refaces || [],
      alt: o.alt || 'the battlefield'
    };
  }
  function boardSvg(o) { return DX.board(boardOpts(o)); }

  /* ================================================== SCREEN DEFINITIONS */
  var SC = {};

  /* ---- FB-01 objective ---- */
  SC['FB-01'] = function () {
    var r = rule('OBJECTIVE');
    return {
      title: 'THE OBJECTIVE', hideAp: true,
      vis: boardSvg({ showObjective: true, meTone: 'bystander', alt: 'the battlefield with the objective glowing' }),
      name: 'COMPLETE THE OBJECTIVE', instr: r.instruction, cons: r.consequence,
      buttons: [{ label: 'BEGIN BATTLE', to: 'FB-02' }]
    };
  };

  /* ---- FB-02 alternation ---- */
  SC['FB-02'] = function () {
    var r = rule('ALTERNATION');
    return {
      title: 'ACTIVATION', hideAp: true,
      vis: boardSvg({ meHalo: true, alt: 'one figure chosen, everything else faded' }),
      name: 'ACTIVATE ONE FIGURE', instr: r.instruction, cons: r.consequence,
      buttons: [{ label: 'CHOOSE THIS FIGURE', to: 'FB-03' }]
    };
  };

  /* ---- FB-03 read the figure ---- */
  SC['FB-03'] = function () {
    return {
      title: 'READ THE FIGURE',
      vis: '<div class="stack">' +
        DX.svg(DX.base({ at: [6,6], shape: 'Square', size: 'Medium', facing: 'N', tone: 'acting' }),
               { viewBox: '38 38 44 44', alt: 'a square base, facing marked by its notch' }) +
        DX.apPips(2, 2) +
        '<div class="tapnote"><b>SQUARE — 2 AP</b> &nbsp;·&nbsp; <i>Circle — 3 AP</i></div>' +
        '</div>',
      name: 'THIS FIGURE HAS ' + ME.stats.max_ap + ' AP',
      instr: 'AP is what a figure can spend this activation.',
      cons: 'Read it off the base.',
      buttons: [{ label: 'SPEND AP', to: 'FB-04' }]
    };
  };

  /* ---- FB-04 the hub ---- */
  SC['FB-04'] = function () {
    if (S.ap <= 0 || S.over) return { redirect: 'FB-99' };
    var canAct = !S.attackUsed;
    return {
      title: 'SPEND 1 AP',
      vis: boardSvg({ alt: 'the battlefield' }),
      name: 'SPEND 1 AP', instr: '', cons: '',
      custom: '<div class="verbs">' +
        verbTile('MOVE', 'Change position now.', true) +
        verbTile('ACTION', 'Resolve a packet now.', canAct) +
        verbTile('WAIT', 'Arm a packet for later.', true) +
        '</div>' +
        (canAct ? '' : '<div class="gate" id="gate">One attack per activation</div>')
    };
  };
  function verbTile(v, d, on) {
    return '<button class="verb" type="button" data-verb="' + v + '"' + (on ? '' : ' disabled') + '>' +
      DX.verbIcon(v) + '<div class="vw">' + v + '</div><div class="vd">' + d + '</div></button>';
  }

  /* ---- FB-M1 move ---- */
  SC['FB-M1'] = function () {
    var CONTACT = Math.round((dist(S.at, S.gob.A.at) - contactGap()) * 10) / 10;
    var maxMove = Math.min(ME.stats.speed, 6);
    /* Commit the default immediately. The slider opens sitting on CONTACT, so
       a player who taps FINISH MOVE without dragging must actually move there
       — not stand still because `pending` was never written. */
    if (S.pending == null) S.pending = Math.min(CONTACT, maxMove);
    var cur = S.pending;
    return {
      title: 'MOVE — 1 AP',
      vis: movePreview(cur, CONTACT),
      name: 'MOVE — 1 AP',
      instr: 'Move up to ' + ME.stats.speed + ' inches — this figure’s Speed.',
      cons: 'Drag the slider, then release.',
      custom: '<div class="ruler">' +
        '<input id="mv" type="range" min="0" max="' + maxMove + '" step="0.2" value="' + cur + '" ' +
        'aria-label="How far to move, in inches">' +
        '<div class="ruler-ticks"><span>0</span><b>' + CONTACT.toFixed(1) + '&quot; CONTACT</b>' +
        '<span>' + maxMove.toFixed(1) + '&quot; MAX</span></div></div>',
      buttons: [{ label: 'FINISH MOVE', act: 'doMove' }],
      minor: { label: 'back', to: 'FB-04' },
      onMount: function () {
        var el = document.getElementById('mv');
        el.addEventListener('input', function () {
          S.pending = parseFloat(el.value);
          document.getElementById('vis').innerHTML = movePreview(S.pending, CONTACT);
        });
      }
    };
  };
  function movePreview(d, contact) {
    var to = [S.at[0], S.at[1] + d];
    return DX.board(boardOpts({
      ghostFrom: S.at, meAt: to,
      paths: d > 0.05 ? [{ from: S.at, to: to, distance: d }] : [],
      alt: 'moving ' + d.toFixed(1) + ' inches forward'
    }));
  }

  /* ---- FB-A1 choose a packet ---- */
  SC['FB-A1'] = function () {
    return {
      title: 'ACTION — 1 AP',
      vis: '<div class="stack">' + DX.packetCard(MYPACKET, null) +
        '<div class="tapnote">This figure has one packet. It is already chosen.</div></div>',
      name: 'ACTION — 1 AP',
      instr: rule('ACTION').instruction, cons: 'A packet is one thing it can do.',
      buttons: [{ label: 'CHOOSE TARGET', to: 'FB-A1b' }],
      minor: { label: 'back', to: 'FB-04' }
    };
  };

  /* ---- FB-A1b declare the target ---- */
  SC['FB-A1b'] = function () {
    var legal = touching();
    if (!legal.length) {
      return {
        title: 'NO TARGET',
        vis: boardSvg({ alt: 'nothing is close enough to hit' }),
        trig: 'Your bases are not touching.',
        name: 'NOTHING IS IN REACH',
        instr: 'This packet is melee. Your bases must touch.',
        cons: 'No AP is spent.',
        buttons: [{ label: 'BACK', to: 'FB-04' }]
      };
    }
    return {
      title: 'DECLARE THE TARGET',
      vis: boardSvg({ focus: legal, halo: legal, alt: 'legal targets are ringed in gold' }),
      hits: legal,
      name: 'DECLARE THE TARGET',
      instr: rule('DECLARE').instruction,
      cons: 'Tap the figure you are hitting.'
    };
  };

  /* ---- FB-A2 roll ---- */
  SC['FB-A2'] = function () {
    return {
      title: 'ROLL',
      vis: S.lastRoll
        ? '<div class="stack">' + DX.dice(S.lastRoll, MYPACKET.success) +
          '<div class="tapnote">SUCCESSES &nbsp;<b>' + succ(S.lastRoll, MYPACKET.success) + '</b></div></div>'
        : '<div class="stack">' + DX.dice([0,0,0].map(function(){return '?';}), 99) + '</div>',
      name: 'ROLL ' + MYPACKET.dice + ' DICE · ' + MYPACKET.success + '+',
      instr: 'Every die that meets or beats ' + MYPACKET.success + ' is a Success.',
      cons: 'Count them.',
      buttons: S.lastRoll
        ? [{ label: 'READ THE GRADE', to: 'FB-A2b' }]
        : [{ label: 'ROLL', act: 'doRoll' }]
    };
  };

  /* ---- FB-A2b read the grade ---- */
  SC['FB-A2b'] = function () {
    var g = S.lastGrade;
    return {
      title: 'THE GRADE',
      vis: '<div class="stack">' + DX.packetCard(MYPACKET, g || null) + '</div>',
      trig: g ? 'You rolled ' + succ(S.lastRoll, MYPACKET.success) + ' successes.' : 'You rolled no successes.',
      name: g ? 'GRADE ' + g : 'NO GRADE — A MISS',
      instr: g ? 'Your Successes are your Grade. Read only that line.' : 'No successes means no Grade, and no effect.',
      cons: g ? 'A higher Grade does not carry up the lower ones.' : 'The blow did not land.',
      buttons: [{ label: g ? 'APPLY THE GRADE' : 'CONTINUE', to: g ? 'FB-A2c' : 'ROUTER-A' }]
    };
  };

  /* ---- FB-A2c armour ---- */
  SC['FB-A2c'] = function () {
    var tgt = S.gob[S.target];
    var track = ['FINE', 'DOWN'];
    return {
      title: 'ARMOUR',
      vis: '<div class="stack">' +
        (S.armourRoll ? DX.dice(S.armourRoll, GOB.stats.armour_save) : '') +
        DX.woundTrack(track, Math.min(tgt.wounds, 1)) +
        '<div class="tapnote">Goblin armour — <b>Light, ' + GOB.stats.armour_save + '+</b>' +
        (S.armourRoll ? ' &nbsp;·&nbsp; ' + (S.saved ? S.saved + ' saved' : 'no save') : '') + '</div></div>',
      name: 'ONE SAVE PER WOUND',
      instr: 'The defender rolls its Armour — Light, ' + GOB.stats.armour_save + '+.',
      cons: 'Unsaved Wounds land.',
      buttons: S.armourRoll
        ? [{ label: 'CONTINUE', to: 'ROUTER-A' }]
        : [{ label: 'APPLY WOUNDS', act: 'doArmour' }]
    };
  };

  /* ---- FB-W1 wait ---- */
  SC['FB-W1'] = function () {
    return {
      title: 'WAIT — 1 AP',
      vis: '<div class="stack">' + DX.packetCard(MYPACKET, null) +
        '<div class="tapnote">' + (S.armed ? '<b>ARMED</b> — it fires on its trigger'
          : 'This packet moves into the ARMED slot') + '</div></div>',
      name: 'WAIT — 1 AP',
      instr: rule('WAIT').instruction,
      cons: 'Waiting ends this figure’s activation.',
      buttons: [{ label: 'ARM PACKET', act: 'doWait' }],
      minor: { label: 'back', to: 'FB-04' }
    };
  };

  /* ---- FB-99 pass ---- */
  SC['FB-99'] = function () {
    return {
      title: 'ACTIVATION OVER',
      vis: boardSvg({ meTone: 'bystander', halo: livingGoblins().slice(0,1),
                      alt: 'your figure is spent; the enemy is next' }),
      name: 'YOUR ACTIVATION IS OVER',
      instr: 'Mark the figure Activated.',
      cons: 'Your opponent now chooses one figure.',
      buttons: [{ label: 'PASS TO OPPONENT', to: 'END' }]
    };
  };

  /* ---- END card ---- */
  SC['END'] = function () {
    var killed = ['A','B','C'].filter(function (k) { return S.gob[k].dead; }).length;
    var shaken = ['A','B','C'].filter(function (k) { return !S.gob[k].dead && S.gob[k].morale > 0; }).length;
    var bits = [];
    if (killed) bits.push(killed + (killed === 1 ? ' goblin down' : ' goblins down'));
    if (shaken) bits.push(shaken + ' shaken');
    if (S.swordsmanWounds) bits.push('you took ' + S.swordsmanWounds + ' wound' + (S.swordsmanWounds > 1 ? 's' : ''));
    return {
      title: 'DONE', hideAp: true,
      vis: boardSvg({ showObjective: true, meTone: 'bystander', alt: 'the battlefield after one activation' }),
      trig: bits.length ? bits.join(' · ') : 'One activation, spent.',
      name: 'THAT IS ENOUGH TO PLAY',
      instr: 'Everything else arrives when it happens on the board.',
      cons: '',
      buttons: [
        { label: 'PLAY IT AGAIN', act: 'restart' },
        { label: 'SEE THE FULL RULES', href: 'HOW_TO_PLAY_v1_5.html', ghost: true }
      ],
      minor: { label: 'all 54 rules', href: 'RULES_SOURCE.html' }
    };
  };

  /* ==================================================== ENCOUNTER LESSONS
   * A lesson fires once, interrupts, and returns where it was called from. */
  var LESSON = {
    'LE-ENGAGED': { after: 'FB-04', pages: [
      function () { return {
        vis: boardSvg({ focus: touching(), refaces: touching().map(function (k) { return S.gob[k].at; }),
                        alt: 'two bases in contact, both turned to face' }),
        trig: 'Your bases touched.', name: 'ENGAGED',
        instr: rule('ENGAGED').instruction, cons: rule('ENGAGED').consequence }; },
      function () { return {
        vis: boardSvg({ focus: touching(),
          paths: [{ from: S.at, to: [S.at[0] - 2.2, S.at[1] - 1.4], distance: null }],
          alt: 'leaving the fight costs one AP' }),
        trig: 'You want to walk away.', name: 'LEAVING COSTS 1 AP',
        instr: rule('DISENGAGE').instruction, cons: rule('DISENGAGE').consequence }; },
      function () { var t = touching()[0]; return {
        vis: boardSvg({ focus: touching(), strikes: t ? [
            { from: S.at, to: S.gob[t].at },
            { from: S.gob[t].at, to: S.at, counter: true, bow: 6 }] : [],
          alt: 'you strike, and it strikes back' }),
        trig: 'You are in contact.', name: 'CONTACT ALLOWS A COUNTER',
        instr: 'When you strike, the defender strikes back.', cons: 'Contact cuts both ways.' }; }
    ]},

    'LE-COUNTER': { after: 'ROUTER-N', pages: [
      function () { var t = S.target, g = S.gob[t]; return {
        vis: '<div class="stack">' + DX.board(boardOpts({
            focus: [t], refaces: [g.at],
            strikes: [{ from: g.at, to: S.at, counter: true }],
            alt: 'the goblin turns and strikes back' })) +
          (S.counterRoll ? DX.dice(S.counterRoll, GOBPACKET.success) : '') + '</div>',
        trig: 'You attacked a free figure.', name: 'COUNTER',
        instr: rule('COUNTER').instruction, cons: rule('COUNTER').consequence,
        button: S.counterRoll ? null : { label: 'RESOLVE THE COUNTER', act: 'doCounter' } }; },
      function () { return {
        vis: '<div class="stack">' + DX.board(boardOpts({
            strikes: S.gob[S.target].dead ? [{ from: S.gob[S.target].at, to: S.at, counter: true }] : [],
            alt: 'the dying swing still lands' })) +
          '<div class="tapnote">' + (S.counterWounds
            ? '<b class="red">' + S.counterWounds + ' wound through</b> — your armour did not save it'
            : 'Your armour held') + '</div></div>',
        trig: S.gob[S.target].dead ? 'It was already falling.' : 'It is still standing.',
        name: S.gob[S.target].dead ? 'IT SWINGS EVEN AS IT DIES' : 'IT WILL COUNTER AGAIN',
        instr: rule('COUNTER_DYING').instruction, cons: rule('COUNTER_NO_LOOP').consequence }; }
    ]},

    'LE-WOUND': { after: 'LE-COUNTER', pages: [
      function () { var t = S.gob[S.target]; return {
        vis: '<div class="stack">' + DX.woundTrack(['FINE','DOWN'], t.dead ? 1 : 0) + '</div>',
        trig: 'The blow landed.', name: 'MARK THE WOUND',
        instr: rule('WOUND_TRACK').instruction, cons: 'Fine → Hurt → Knocked Out → Dead.' }; },
      function () { return {
        vis: boardSvg({ alt: 'the body is removed and the space is free' }),
        trig: 'It had one Wound.', name: 'IT IS DOWN',
        instr: 'Remove the figure.', cons: 'Its space is free again.',
        only: function () { return S.gob[S.target].dead; } }; }
    ]},

    'LE-NERVE': { after: 'FB-04', pages: [
      function () { var w = S.nerveWho; return {
        vis: boardSvg({ focus: [w], rings: [{ at: S.gob[S.target].at, r: 3, label: '3" SHOCK' }],
          alt: 'a friend fell inside the three inch band' }),
        trig: 'A goblin fell beside its friend.', name: 'THIS CAUSES SHOCK',
        instr: rule('SHOCK').instruction, cons: 'One test per shock.' }; },
      function () { return {
        vis: '<div class="stack">' + (S.nerveRoll ? DX.dice(S.nerveRoll, GOB.stats.nerve)
          : DX.dice(['?','?','?'], 99)) +
          '<div class="tapnote">Its Nerve is <b>' + GOB.stats.nerve + '</b>' +
          (S.nerveRoll ? ' &nbsp;·&nbsp; <b>' + S.nerveSucc + '</b> successes' : '') + '</div></div>',
        trig: 'It must test.', name: 'ROLL 3 DICE',
        instr: 'Count dice that meet or beat its Nerve — ' + GOB.stats.nerve + '.', cons: '',
        button: S.nerveRoll ? null : { label: 'ROLL NERVE', act: 'doNerve' } }; },
      function () { var m = S.gob[S.nerveWho].morale; return {
        vis: '<div class="stack">' + DX.moraleTrack(m) +
          '<div class="tapnote"><b>0</b> step down &nbsp;·&nbsp; <b>1–2</b> hold &nbsp;·&nbsp; <b>3</b> step up</div></div>',
        trig: S.nerveSucc + (S.nerveSucc === 1 ? ' success.' : ' successes.'),
        name: m === 0 ? 'IT HOLDS' : (m === 1 ? 'IT IS SHAKEN' : 'IT IS BROKEN'),
        instr: rule('MORALE').instruction,
        cons: m === 1 ? 'One more shock and it breaks.' : rule('MORALE').consequence }; },
      function () { return {
        vis: boardSvg({ focus: [S.nerveWho],
          arrows: [{ from: S.gob[S.nerveWho].at, to: [S.gob[S.nerveWho].at[0], 11.4] }],
          alt: 'the broken goblin flees off its own edge' }),
        trig: 'This goblin is Cowardly.', name: 'IT FLEES',
        instr: 'A Broken figure Routs by its Temperament.',
        cons: 'A Cowardly figure flees to its own table edge.',
        only: function () { return S.gob[S.nerveWho].morale >= 2; } }; }
    ]},

    'LE-SPRINT': { after: 'ROUTER-SPRINT', pages: [
      function () { return {
        vis: boardSvg({ ghostFrom: S.sprintFrom || S.at, alt: 'two moves in one activation' }),
        trig: 'You moved twice.', name: 'SPRINT',
        instr: rule('SPRINT').instruction, cons: '' }; },
      function () { return {
        vis: '<div class="stack">' + DX.apPips(2, 0) + '</div>',
        trig: 'Both AP went to movement.', name: 'YOUR ACTIVATION IS SPENT',
        instr: 'There is no attack left.', cons: 'Moving twice costs you the blow.' }; }
    ]},

    'LE-IMPACT': { after: 'FB-99', pages: [
      function () { return {
        vis: boardSvg({ focus: touching(), alt: 'the sprint reaches the enemy line' }),
        trig: 'You sprinted into an enemy.', name: 'IMPACT',
        instr: rule('IMPACT').instruction, cons: rule('IMPACT').consequence }; },
      function () { return {
        vis: boardSvg({ focus: touching(),
          arrows: touching().length ? [{ from: S.gob[touching()[0]].at,
            to: [S.gob[touching()[0]].at[0], S.gob[touching()[0]].at[1] + 1.3] }] : [],
          alt: 'the line is carried forward and dents' }),
        trig: 'The bodies beside it blocked the shove.', name: 'INDENT',
        instr: rule('INDENT').instruction, cons: 'Push and Crush are in the full rules.' }; }
    ]}
  };

  /* ============================================================ NAVIGATION */
  var here = 'FB-01', stack = [], lesson = null, page = 0;

  function go(id) {
    if (id === 'RESTART') { reset(); stack = []; lesson = null; page = 0; here = 'FB-01'; return draw(); }
    if (LESSON[id]) {
      if (S.seen[id]) return go(LESSON[id].after);
      S.seen[id] = true; lesson = id; page = 0;
      return advanceLessonToVisible(0);
    }
    if (id.indexOf('ROUTER') === 0) return router(id);
    stack.push(here); here = id; lesson = null; draw();
  }
  function advanceLessonToVisible(from) {
    var pages = LESSON[lesson].pages;
    for (var i = from; i < pages.length; i++) {
      var p = pages[i]();
      if (!p.only || p.only()) { page = i; return draw(); }
    }
    var after = LESSON[lesson].after; lesson = null; return go(after);
  }
  function nextLessonPage() {
    return advanceLessonToVisible(page + 1);
  }

  function router(id) {
    if (id === 'ROUTER-M') {
      if (S.moves === 2) return go('LE-SPRINT');
      if (touching().length) { S.engaged = touching()[0]; return go('LE-ENGAGED'); }
      return go('FB-04');
    }
    if (id === 'ROUTER-SPRINT') {
      if (touching().length) return go('LE-IMPACT');
      return go('FB-99');
    }
    if (id === 'ROUTER-A') {
      if (S.woundsLanded > 0) return go('LE-WOUND');
      return go('LE-COUNTER');
    }
    if (id === 'ROUTER-N') {
      var victim = S.gob[S.target];
      if (victim.dead) {
        var who = livingGoblins().filter(function (k) { return dist(S.gob[k].at, victim.at) <= 3.0; })[0];
        if (who) { S.nerveWho = who; S.nerveRoll = null; return go('LE-NERVE'); }
      }
      return go('FB-04');
    }
    return go('FB-04');
  }

  /* =============================================================== ACTIONS */
  var ACT = {
    doMove: function () {
      var d = S.pending == null ? 0 : S.pending;
      S.sprintFrom = S.at.slice();
      S.at = [S.at[0], S.at[1] + d];
      S.pending = null; S.ap--; S.moves++;
      go('ROUTER-M');
    },
    doRoll: function () {
      /* The ACTION is spent the moment it resolves — hit or miss. Spending it
         here (not in doArmour) means a whiff still costs the AP and still
         counts as your one attack, which is what B.5 and B.15 actually say. */
      S.lastRoll = roll(MYPACKET.dice);
      var k = succ(S.lastRoll, MYPACKET.success);
      S.lastGrade = Math.min(k, MYPACKET.grades.length);
      S.ap--; S.attackUsed = true;
      draw();
    },
    doArmour: function () {
      var g = MYPACKET.grades[S.lastGrade - 1];
      var wounds = 0;
      (g ? g.effects : []).forEach(function (e) {
        var m = /^(\d+)\s+Wound/.exec(e); if (m) wounds += parseInt(m[1], 10);
      });
      S.armourRoll = roll(wounds);
      S.saved = succ(S.armourRoll, GOB.stats.armour_save);
      S.woundsLanded = wounds - S.saved;
      var t = S.gob[S.target];
      t.wounds += S.woundsLanded;
      if (t.wounds >= GOB.stats.max_wounds) t.dead = true;
      draw();
    },
    doCounter: function () {
      S.counterRoll = roll(GOBPACKET.dice);
      var k = succ(S.counterRoll, GOBPACKET.success);
      S.counterGrade = Math.min(k, GOBPACKET.grades.length);
      var w = 0;
      if (S.counterGrade) {
        (GOBPACKET.grades[S.counterGrade - 1].effects || []).forEach(function (e) {
          var m = /^(\d+)\s+Wound/.exec(e); if (m) w += parseInt(m[1], 10);
        });
      }
      var savedC = succ(roll(w), ME.stats.armour_save);
      S.counterWounds = Math.max(0, w - savedC);
      S.swordsmanWounds += S.counterWounds;
      draw();
    },
    doNerve: function () {
      S.nerveRoll = roll(3);
      S.nerveSucc = succ(S.nerveRoll, GOB.stats.nerve);
      var g = S.gob[S.nerveWho];
      if (S.nerveSucc === 0) g.morale = Math.min(2, g.morale + 1);
      else if (S.nerveSucc === 3) g.morale = Math.max(0, g.morale - 1);
      draw();
    },
    doWait: function () { S.armed = true; S.ap--; S.over = true; go('FB-99'); },
    restart: function () { go('RESTART'); }
  };

  /* ================================================================= DRAW */
  var lastScreen = null;
  function draw() {
    var s;
    if (lesson) {
      s = LESSON[lesson].pages[page]();
      s.title = lesson.replace('LE-', '');
      s.prog = (page + 1) + ' / ' + LESSON[lesson].pages.filter(function (f) {
        var p = f(); return !p.only || p.only();
      }).length;
      if (!s.button) s.buttons = [{ label: 'CONTINUE', act: '__nextPage' }];
      else s.buttons = [s.button];
    } else {
      s = SC[here]();
      if (s.redirect) { here = s.redirect; s = SC[here](); }
    }
    lastScreen = s;

    document.getElementById('title').textContent = s.prog ? s.title + '  ' + s.prog : s.title;
    document.getElementById('back').disabled = !stack.length && !lesson;

    var ap = document.getElementById('ap');
    ap.innerHTML = s.hideAp ? '' : (function () {
      var o = ''; for (var i = 0; i < S.apMax; i++) o += '<i class="' + (i < S.ap ? '' : 'spent') + '"></i>';
      return o;
    })();

    document.getElementById('vis').innerHTML = s.vis || '';

    var say = '';
    if (s.trig) say += '<div class="fb-trig">' + s.trig + '</div>';
    say += '<div class="fb-name">' + s.name + '</div>';
    if (s.instr) say += '<div class="fb-instr">' + s.instr + '</div>';
    if (s.cons)  say += '<div class="fb-cons">' + s.cons + '</div>';
    document.getElementById('say').innerHTML = say;

    var ctl = '';
    if (s.custom) ctl += s.custom;
    (s.buttons || []).forEach(function (b) {
      if (b.href) ctl += '<a class="btn' + (b.ghost ? ' ghost' : '') + '" href="' + b.href + '">' + b.label + '</a>';
      else ctl += '<button class="btn" type="button" data-to="' + (b.to || '') + '" data-act="' +
        (b.act || '') + '">' + b.label + '</button>';
    });
    if (s.minor) {
      ctl += s.minor.href
        ? '<a class="btn-min" href="' + s.minor.href + '">' + s.minor.label + '</a>'
        : '<button class="btn-min" type="button" data-to="' + s.minor.to + '">' + s.minor.label + '</button>';
    }
    document.getElementById('ctl').innerHTML = ctl;

    /* tap-a-target overlay */
    if (s.hits) {
      var vis = document.getElementById('vis');
      var svgEl = vis.querySelector('svg');
      var box = document.createElement('div');
      box.className = 'targets';
      s.hits.forEach(function (k) {
        var g = S.gob[k];
        var pct = { x: DX.sx(g.at[0]) / (DX.FIELD * DX.U) * 100, y: DX.sy(g.at[1]) / (DX.FIELD * DX.U) * 100 };
        var r = svgEl ? svgEl.getBoundingClientRect() : null;
        var b = document.createElement('button');
        b.className = 'hit'; b.type = 'button';
        b.setAttribute('aria-label', 'Attack this goblin');
        b.style.width = b.style.height = '52px';
        if (r) {
          var v = vis.getBoundingClientRect();
          b.style.left = (r.left - v.left + r.width * pct.x / 100) + 'px';
          b.style.top  = (r.top  - v.top  + r.height * pct.y / 100) + 'px';
        }
        b.addEventListener('click', function () { S.target = k; S.lastRoll = null; S.armourRoll = null; go('FB-A2'); });
        box.appendChild(b);
      });
      vis.appendChild(box);
    }

    if (s.onMount) s.onMount();
  }

  /* ============================================================== EVENTS */
  document.getElementById('ctl').addEventListener('click', function (e) {
    var b = e.target.closest('[data-act],[data-to],[data-verb]');
    if (!b) return;
    if (b.dataset.verb) {
      if (b.disabled) { var gt = document.getElementById('gate'); if (gt) { gt.classList.remove('pulse'); void gt.offsetWidth; gt.classList.add('pulse'); } return; }
      return go({ MOVE: 'FB-M1', ACTION: 'FB-A1', WAIT: 'FB-W1' }[b.dataset.verb]);
    }
    if (b.dataset.act === '__nextPage') return nextLessonPage();
    if (b.dataset.act) return ACT[b.dataset.act]();
    if (b.dataset.to) return go(b.dataset.to);
  });
  document.getElementById('back').addEventListener('click', function () {
    if (lesson) { if (page > 0) { page--; return draw(); } lesson = null; return draw(); }
    if (stack.length) { here = stack.pop(); draw(); }
  });
  document.getElementById('exit').addEventListener('click', function () {
    if (confirm('Leave the tutorial?')) location.href = 'index.html';
  });
  addEventListener('resize', function () { draw(); });

  /* Test hook. Lets the flow be driven headlessly so a full playthrough can
     be verified without a browser. Costs nothing at runtime. */
  window.__FB = {
    go: function (id) { return go(id); },
    act: function (name) { return ACT[name](); },
    draw: function () { return draw(); },
    state: function () { return S; },
    where: function () { return lesson ? lesson + ':' + page : here; },
    current: function () { return lastScreen; },
    nextPage: function () { return nextLessonPage(); },
    screens: SC, lessons: LESSON,
    helpers: { touching: touching, contactGap: contactGap, dist: dist, livingGoblins: livingGoblins }
  };

  draw();
})();
</script>
</body>
</html>
